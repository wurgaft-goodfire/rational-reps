# @package model_kwargs
# GPTNeoX transformer. vocab_size / max_position_embeddings are derived from the dataset at
# train time (see train.py), so they are not specified here.
model_type: transformer
model_config:
  hidden_size: 32
  num_hidden_layers: 2
  num_attention_heads: 2
  intermediate_size: 64
  use_parallel_residual: False
  attention_bias: False
  use_cache: False
  is_decoder: True
  classifier_dropout: 0.0
