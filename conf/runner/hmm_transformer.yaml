# @package _global_
# HMM experiment: latent states walk a graph, emitting observable tokens. A single layer with a
# single head reaches Bayes on belief-tracking (matching 2L/4H on KL, belief probe, and spectral
# CKA) — it just needs more width + training steps than the fully-observed graph tasks.
#   python -m src.code.train runner=hmm_transformer
defaults:
  - override /setting: hmm
  - override /model: transformer
  - override /train: default
  - _self_

# {task}_{arch}: the arch is baked in here (not a CLI override), so it never reaches override_dirname;
# the name is the only thing separating this preset from a generic transformer-on-hmm run.
name: hmm_transformer
output_dir: ${run_dir}/checkpoints
sample_mode: tokens
model_kwargs:
  model_config:
    hidden_size: 128
    num_hidden_layers: 1
    num_attention_heads: 1
    intermediate_size: 512
eval_kwargs:
  output_hidden_states: true
training_kwargs:
  learning_rate: 0.001
  train_steps: 10000
  context_length: 40
