# @package _global_
# Bounded-depth nested Dyck-k: the prefix's sufficient statistic is the stack of open bracket types
# -- a node of the depth-D branching-k tree -> the nested (ultrametric) tree geometry.
#   python -m src.code.train runner=pcfg_dyck
defaults:
  - override /setting: pcfg
  - override /model: transformer
  - override /train: default
  - _self_
name: pcfg_dyck
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: dyck
grammar_kwargs:
  k: 2                     # bracket types
  depth: 4                 # max nesting depth => stack tree has 2+4+8+16 = 30 nodes (depth 5 fails to train)
max_len: 8
model_kwargs:
  model_config: {hidden_size: 128, num_hidden_layers: 4, num_attention_heads: 4, intermediate_size: 512}
training_kwargs: {learning_rate: 0.001, train_steps: 12000}
