# @package _global_
# Miniature natural-language phrase-structure grammar with a GRU: the recurrent state must carry
# the partial parse (which constituents are still open).
#   python -m src.code.train runner=pcfg_mininl_rnn
defaults:
  - override /setting: pcfg
  - override /model: rnn
  - override /train: default
  - _self_
name: pcfg_mininl_rnn
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: mini_nl
grammar_kwargs:
  max_adj: 3               # bounded adjective recursion
max_len: 18
model_kwargs:
  model_config: {embed_dim: 32, hidden_size: 128, num_layers: 1}
training_kwargs: {learning_rate: 0.001, train_steps: 12000}
