# @package _global_
# Exchangeable-family experiment: infer a per-sequence emission distribution in context, for any
# family (default von Mises on a binned circle: the natural-parameter code is a 2D circle).
# Filtering over atoms needs a smoothed histogram of the context, not just a running average, so
# the model gets two layers.
#   python -m src.code.train runner=exchangeable_transformer
defaults:
  - override /setting: exchangeable
  - override /model: transformer
  - override /train: default
  - _self_

# {task}_{arch}: the arch is baked in here (not a CLI override), so it never reaches override_dirname.
name: exchangeable_transformer
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
# n_mu keeps the atom spacing at or below the end-of-context posterior width (~1/sqrt(L*kappa)),
# so the finite pool is indistinguishable from the continuous prior over the whole context.
family: von_mises
family_kwargs:
  n_mu: 96
  kappas: [1.5, 3.0, 4.5]
  x_n: 36
model_kwargs:
  model_config:
    hidden_size: 64
    num_hidden_layers: 2
    num_attention_heads: 2
    intermediate_size: 256
eval_kwargs:
  output_hidden_states: true
training_kwargs:
  learning_rate: 0.001
  train_steps: 10000
  context_length: 64
