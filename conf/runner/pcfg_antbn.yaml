# @package _global_
# a^n T b^n: a^n b^n with an explicit trigger terminal T at the phase boundary. The unmatched-a
# counter is the belief; T makes the switch from opening to closing a single observable event.
#   python -m src.code.train runner=pcfg_antbn
defaults:
  - override /setting: pcfg
  - override /model: transformer
  - override /train: default
  - _self_
name: pcfg_antbn
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: antbn
grammar_kwargs:
  depth: 10                # n ~ uniform 1..10 => up to a^10 T b^10
max_len: 21
model_kwargs:
  model_config: {hidden_size: 128, num_hidden_layers: 4, num_attention_heads: 4, intermediate_size: 512}
training_kwargs: {learning_rate: 0.001, train_steps: 6000, context_length: 45}
