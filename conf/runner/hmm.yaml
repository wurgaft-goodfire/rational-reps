# @package _global_
# HMM experiment: latent states walk a graph, emitting observable tokens. Belief-tracking needs a
# bigger transformer + longer training than the fully-observed graph tasks (the default tiny model
# under-fits and never reaches Bayes). Sized to reach Bayes-optimal on the belief-tracking task.
#   python -m src.code.train runner=hmm
defaults:
  - override /setting: hmm
  - override /model: transformer
  - override /train: default
  - _self_

name: hmm
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
model_kwargs:
  model_config:
    hidden_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    intermediate_size: 512
training_kwargs:
  learning_rate: 0.001
  train_steps: 10000
  context_length: 40
