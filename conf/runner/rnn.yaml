# @package _global_
# RNN (GRU) causal language model — a sequence model over walks; choose the task with `setting=`.
#   python -m src.code.train runner=rnn setting=graph
defaults:
  - override /model: rnn
  - override /train: default
  - _self_

name: rnn
output_dir: ${run_dir}/checkpoints
sample_mode: pointwise
training_kwargs:
  learning_rate: 0.005     # sequence LM wants a lower lr than the readouts
  batch_size: 4096         # tiled enumeration: a large sampled batch stands in for the exact row
