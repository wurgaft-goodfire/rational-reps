# @package _global_
# Gaussian exchangeable experiment: infer a per-sequence N(mu, sigma) in context from binned iid
# samples. Unlike the categorical/von Mises cases, Gaussians are not closed under mixing, so the
# logit code has off-manifold (uncertainty) components early in context and curved trajectories
# onto the natural-parameter half-plane.
# The (n_mu, n_sig) grid keeps atom spacing at or below the end-of-context posterior width
# (~sigma/sqrt(L) in mu, ~sigma/sqrt(2L) in sigma), so the finite pool is indistinguishable from
# the continuous prior over the whole context.
#   python -m src.code.train runner=gaussian_transformer
defaults:
  - override /setting: exchangeable
  - override /model: transformer
  - override /train: default
  - _self_

# {task}_{arch}: the arch is baked in here (not a CLI override), so it never reaches override_dirname.
name: gaussian_transformer
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
family: gaussian1d
family_kwargs:
  n_mu: 64
  n_sig: 16
  x_n: 36
  x_lim: 6.0
  mu_lim: 2.5
  sig_lo: 0.6
  sig_hi: 1.8
model_kwargs:
  model_config:
    hidden_size: 64
    num_hidden_layers: 2
    num_attention_heads: 2
    intermediate_size: 256
eval_kwargs:
  output_hidden_states: true
training_kwargs:
  learning_rate: 0.001
  train_steps: 10000
  context_length: 64
