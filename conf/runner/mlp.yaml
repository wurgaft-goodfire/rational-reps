# @package _global_
# MLP runner — model-centric; choose the task with `setting=`. Pointwise, full-batch.
#   python -m src.code.train runner=mlp setting=graph
defaults:
  - override /model: mlp
  - override /train: default
  - _self_

name: mlp
output_dir: ${run_dir}/checkpoints
sample_mode: pointwise
training_kwargs:
  learning_rate: 0.00333   # ring sweep: the readout default 0.01 underfits the mlp
