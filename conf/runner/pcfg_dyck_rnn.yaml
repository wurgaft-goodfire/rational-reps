# @package _global_
# Bounded-depth Dyck-k with a GRU: the recurrent state must carry the stack of open bracket types.
#   python -m src.code.train runner=pcfg_dyck_rnn
defaults:
  - override /setting: pcfg
  - override /model: rnn
  - override /train: default
  - _self_
name: pcfg_dyck_rnn
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: dyck
grammar_kwargs:
  k: 2                     # bracket types
  depth: 4                 # max nesting depth => stack tree has 2+4+8+16 = 30 nodes
max_len: 8
model_kwargs:
  model_config: {embed_dim: 32, hidden_size: 128, num_layers: 1}
training_kwargs: {learning_rate: 0.001, train_steps: 12000}
