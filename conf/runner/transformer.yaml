# @package _global_
# Transformer runner — model-centric; choose the task with `setting=`. Sequence mode (walks).
#   python -m src.code.train runner=transformer setting=graph
defaults:
  - override /model: transformer
  - override /train: default
  - _self_

name: transformer
output_dir: ${run_dir}/checkpoints
sample_mode: pointwise
training_kwargs:
  learning_rate: 0.001     # ring sweep: lower lr + long training (CKA 0.997)
  batch_size: 4096         # tiled enumeration: a large sampled batch stands in for the exact row
