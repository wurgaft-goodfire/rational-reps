# @package _global_
# Transformer runner — model-centric; choose the task with `setting=`. Sequence mode (walks).
#   python -m src.code.train runner=transformer setting=graph
defaults:
  - override /model: transformer
  - override /train: default
  - _self_

name: transformer
output_dir: ${run_dir}/checkpoints
sample_mode: tokens
training_kwargs:
  learning_rate: 0.003     # sequence LM wants a lower lr than the readouts
