# @package _global_
# a^n b^n with a GRU: the recurrent state is the network's *entire* memory of the prefix, so it must
# itself carry the predictive state (the count of unmatched a's).
#   python -m src.code.train runner=pcfg_anbn_rnn
defaults:
  - override /setting: pcfg
  - override /model: rnn
  - override /train: default
  - _self_
name: pcfg_anbn_rnn
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: anbn
grammar_kwargs:
  depth: 12                # n ~ uniform 1..12 => sentences up to a^12 b^12
max_len: 24
model_kwargs:
  model_config: {embed_dim: 32, hidden_size: 128, num_layers: 1}
training_kwargs: {learning_rate: 0.001, train_steps: 12000}
