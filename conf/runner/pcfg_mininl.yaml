# @package _global_
# Miniature natural-language phrase-structure grammar (POS terminals). The prefix's sufficient
# statistic is the partial parse -- which constituents are still open -- a soft branching geometry.
#   python -m src.code.train runner=pcfg_mininl
defaults:
  - override /setting: pcfg
  - override /model: transformer
  - override /train: default
  - _self_
name: pcfg_mininl
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: mini_nl
grammar_kwargs:
  max_adj: 3               # bounded adjective recursion
max_len: 18
model_kwargs:
  model_config: {hidden_size: 128, num_hidden_layers: 4, num_attention_heads: 4, intermediate_size: 512}
training_kwargs: {learning_rate: 0.001, train_steps: 12000, context_length: 40}
