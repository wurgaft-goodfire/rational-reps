# @package _global_
# Miniature control-flow programming language (if/while/assign/seq, matched delimiters). The prefix's
# sufficient statistic is the stack of open constructs times the intra-construct phase.
#   python -m src.code.train runner=pcfg_minipl
defaults:
  - override /setting: pcfg
  - override /model: transformer
  - override /train: default
  - _self_
name: pcfg_minipl
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
grammar: mini_pl
grammar_kwargs:
  depth: 3                 # max control-construct nesting depth
max_len: 24
model_kwargs:
  model_config: {hidden_size: 128, num_hidden_layers: 4, num_attention_heads: 4, intermediate_size: 512}
training_kwargs: {learning_rate: 0.001, train_steps: 12000}
