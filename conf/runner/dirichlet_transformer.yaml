# @package _global_
# Dirichlet-categorical experiment: infer a per-sequence categorical distribution in context.
# A single layer with a single head suffices — the Bayes update is a running average of token
# indicators, within reach of one attention layer.
#   python -m src.code.train runner=dirichlet_transformer
defaults:
  - override /setting: dirichlet
  - override /model: transformer
  - override /train: default
  - _self_

# {task}_{arch}: the arch is baked in here (not a CLI override), so it never reaches override_dirname.
name: dirichlet_transformer
output_dir: ${run_dir}/checkpoints
sample_mode: sequence
model_kwargs:
  model_config:
    hidden_size: 64
    num_hidden_layers: 1
    num_attention_heads: 1
    intermediate_size: 256
eval_kwargs:
  output_hidden_states: true
training_kwargs:
  learning_rate: 0.001
  train_steps: 10000
  context_length: 64
