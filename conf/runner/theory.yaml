# @package _global_
# The theory as a model class: the rank-constrained geometry of a feature-cube task
# (geometry.predicted_rank_constrained_geometry), its representation and readout stored as they come in
# a linear model, so it is solved, saved and read exactly like a trained run.
#   python -m src.code.train -m runner=theory setting=superposition
defaults:
  - override /model: linear
  - override /train: default
  - _self_

name: theory
output_dir: ${run_dir}/checkpoints
sample_mode: pointwise

solver:
  n_top: 18            # the completion's pair dictionary: pairs among the first n_top features
