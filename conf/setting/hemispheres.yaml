# @package _global_
# Months x hemispheres -> seasons. Items are (month, hemisphere); the outcomes are 4 season tokens
# and a token per hemisphere. The season attribute is a 12-position ring read out on 4 coarse
# tokens (gaussian kernel), shared by both hemispheres; each hemisphere owns its name token.
# Predicted geometry (rank 3): one season circle carrying every item, both hemispheres at the same
# season phase, stacked along the hemisphere axis; coloured by month, the two circles run half a
# turn out of phase. Without the hemisphere tokens the two circles collapse onto one.
defaults:
  - attribute_tree
  - _self_

structure_kwargs:
  n: 1
  k: 2
  attributes:
    - {node: 0, alpha: 2.0, structure: ring, n: 12, m: 4, cooccurrence: gaussian, gamma: 2.0}
    - {node: 1, alpha: 2.0, structure: ring, n: 1, cooccurrence: gaussian, gamma: 1.0}
    - {node: 2, alpha: 2.0, structure: ring, n: 1, cooccurrence: gaussian, gamma: 1.0}
