# @package _global_
# Feature cube: hypercube product kernel with per-feature couplings w_i = w0(gamma) * w_decay^i
# (importance) under a sparse item measure — feature i active with probability
# sparsity * p_decay^i (frequency).
setting: feature_cube
n_features: 6
gamma: 0.03
sparsity: 0.5
p_decay: 1.0
w_decay: 0.9
sample_mode: pointwise
