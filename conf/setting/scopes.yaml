# @package _global_
# Scope-stack programs (src/code/scopes.py): `for` / `def` / `if` blocks bind a fresh name and stay open
# until `end`; every open scope adds its effect to the next-token scores (its name is used, `for` raises break /
# continue, `def` return / yield, `if` pass; deeper makes `end` likelier). The Bayes next-token state is the stack,
# and its code is one step per open scope: entering a block adds the same vector at any depth, same-kind steps
# share a direction, and with kind_strength 0 (the null) the step depends on the bound name only. Streams are
# always sequences; set training_kwargs.context_length from the CLI (the runner's train defaults override it).
setting: scopes
structure: scope_stack        # names the run directory's task
scope_kwargs:
  n_names: 12
  name_bonus: 4.0
  kind_strength: 0.5       # keeps same-kind sibling blocks farther apart than parent and child
  pool_size: 262144       # programs sampled once; batches draw from them
