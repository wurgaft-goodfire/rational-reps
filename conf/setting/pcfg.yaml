# @package _global_
# PCFG: latent states diffuse DOWN A TREE (branching diffusion on a graph) and each
# leaf emits an observable terminal. The tree generalization of the HMM (which diffuses along a
# chain). The network sees only the flat terminal string; the parse, latent states, and constituent
# boundaries are hidden and must be inferred to predict the next token.
setting: pcfg
grammar: branching_diffusion
grammar_kwargs:
  structure: ring         # latent graph shape (ring reads as a circle, like the HMM)
  n: 12                   # number of latent states
  gamma: 0.8              # latent diffusion decay (per tree edge)
  cooccurrence: diffusion
  p_branch: 0.4           # branch-vs-emit prob (subcritical: 2*p_branch < 1, trees terminate a.s.)
max_len: 24               # max terminals per sentence (rejection-sampled)
sample_mode: sequence
