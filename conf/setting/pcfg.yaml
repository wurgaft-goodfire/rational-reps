# @package _global_
# PCFG: latent states expand down a *parse tree* (the tree generalization of the HMM's chain) and each
# leaf emits an observable terminal. The network sees only the flat terminal string; the parse, latent
# states, and constituent boundaries are hidden and must be inferred to predict the next token. The
# grammar is one of the structured cases (anbn / dyck / mini_nl / mini_pl); this default is dyck, but
# every runner overrides `grammar` + `grammar_kwargs`.
setting: pcfg
grammar: dyck
grammar_kwargs:
  k: 2                     # bracket types
  depth: 3                 # max nesting depth
max_len: 6
sample_mode: sequence
