# @package _global_
# Order-1 latent-structure task: a graph -> diffusion co-occurrence -> log-conditional.
# The predicted geometry is the structure's harmonics (ring -> circle, etc.).
setting: graph-cooccurrence
structure: ring          # graph shape (see the structure gallery in src/code/data.py)
structure_kwargs:        # the full structure spec: shape params + the co-occurrence kernel
  n: 24                  # number of nodes / items
  gamma: 0.8             # diffusion decay for the co-occurrence kernel
  cooccurrence: diffusion  # diffusion (multi-step co-occ) | geodesic (shortest-path gamma**d) | adjacency (raw one-step) | heat (exp(gamma*A))
sample_mode: tokens      # tokens (for transformer/RNN) | pointwise (for the readout models)
