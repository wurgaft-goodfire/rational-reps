# @package _global_
# Order-1 latent-structure task: a graph -> diffusion co-occurrence -> log-conditional.
# The predicted geometry is the structure's harmonics (ring -> circle, etc.).
setting: graph-cooccurrence
structure: ring          # graph shape (see src/code/structures.py)
structure_kwargs:
  n: 24                  # number of nodes / items
gamma: 0.8               # diffusion decay for the co-occurrence kernel
sample_mode: sequence    # sequence (Markov walks, for transformer/RNN) | pointwise (for k-linear/MLP)
