# @package _global_
# Order-2+ task: the latent structure is a relation c = a*b; the conditional is a tensor
# read out bilinearly. Graded relations (max/averaging/entailment) factor cleanly; group relations
# (modular_add/mult, product) are degenerate and the trained model selects a frequency -> circle.
setting: relational
relation: modular_add    # see the relation gallery in src/code/data.py
# each builder carries its own defaults, so `relation=X` alone is enough; override deliberately
# with e.g. +relation_kwargs.p=13
relation_kwargs: {}

# Lapse rate: with this probability the response is uniform over the outcomes. Most of these
# relations answer with a set, so most outcomes have probability zero — and KL weights an outcome
# by its true probability, so a zero one is unscored and its logit unconstrained. The lapse makes
# every outcome possible, which identifies the whole log-conditional without moving the predicted
# geometry (CKA(E*(0.05), E*(0)) > 0.99; see test_relations).
lapse: 0.05
