# @package _global_
# Category tree whose nodes own attribute factors; items are every (leaf, positions) combination and
# the outcomes the attributes' node tokens, log p((a,j)|x) = log_softmax(alpha_a [owner on x's path]
# (1 + kappa_a(z_a, j))). Predicted geometry: one plane per attribute, orthogonal, occupied by the
# owner's subtree, plus the tree's simplices from which attributes each split's children own
# (rank sum_splits (k-1) + 2 * rings). Minimal instance: binary root split, a shared ring at the root
# and a private ring per category: rank 7, top-3 modes = the split plus the shared ring (two stacked
# circles). Full support, so no lapse floor: alpha 2, gamma 1 keeps every token scored.
setting: graph-cooccurrence
structure: attribute_tree
structure_kwargs:
  n: 1
  k: 2
  attributes:
    - {node: 0, alpha: 2.0, structure: ring, n: 8, cooccurrence: gaussian, gamma: 1.0}
    - {node: 1, alpha: 2.0, structure: ring, n: 8, cooccurrence: gaussian, gamma: 1.0}
    - {node: 2, alpha: 2.0, structure: ring, n: 8, cooccurrence: gaussian, gamma: 1.0}
