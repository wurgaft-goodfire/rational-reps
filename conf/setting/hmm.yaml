# @package _global_
# Hidden-Markov task: latent states walk a graph (the graph co-occurrence transition); each state
# emits an observable token. The latent geometry lives in the belief state p(s_t | x_{1:t}) (the
# forward algorithm), not the token embedding.
setting: hmm
structure: ring          # latent graph shape
structure_kwargs:        # the full latent-structure spec: shape params + the transition kernel
  n: 24                 # number of latent states (a ring big enough to read as a circle)
  gamma: 0.8             # latent diffusion decay
  cooccurrence: diffusion  # latent transition: diffusion | geodesic | adjacency | heat
emission: bump           # emission shape placement: bump (Gaussian in hop distance) | permuted (template)
emission_sigma: 1.0      # bump width in hops: small -> sharp / high SNR, large -> aliased (fills the belief disk)
emission_floor: 0.0      # mix each emission row with uniform: weak emissions, no symbol ruled out
transition_floor: 0.0    # mix each transition row with uniform: a leak that bounds the belief's log-range
n_symbols: 24            # alphabet size (permuted only; bump forces n_symbols = n_states)
sample_mode: sequence    # the HMM is a stream by construction
infer_latent: false      # false = predict the next symbol | true = predict the latent state
