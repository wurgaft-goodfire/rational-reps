# @package _global_
# A tree whose edges carry labels (relation types, as in a dependency parse): the edge into a node is a private
# unit step plus sqrt(alpha) times its label's shared step, a node's position p(x) sums the steps on its root
# path, and log p(y|x) = -gamma/2 ||p(x) - p(y)||^2. The code is polar (Diego-Simon et al. 2024): every edge
# has the same length, same-label edges share a direction with cosine alpha / (1 + alpha), different labels are
# orthogonal. alpha = 0 is the geodesic tree kernel (distance only, all edges orthogonal). Labels default to birth
# order among siblings. gamma keeps the logit range gamma/2 (6 + 18 alpha) near 4 nats at depth 3.
setting: graph-cooccurrence
structure: labeled_tree
structure_kwargs:
  n: 3
  k: 3
  alpha: 1.0
  gamma: 0.33
sample_mode: pointwise
model_kwargs:
  model_config:
    embed_dim: 64          # full rank: the code has rank 39 (40 nodes)
