defaults:
  - setting: graph
  - model: transformer
  - train: default
  - _self_
  - runner: transformer

# Experiment metadata
name: ??? # Must be set by the runner config
random_seed: 42
overwrite: false # Flag for overwriting existing checkpoints / metrics

# Weights & Biases logging. Off by default (we train small models locally); set
# `wandb.enabled=true` to log init + online metrics.
wandb:
  enabled: false
  entity: null # null -> use the WANDB_ENTITY env var / your default entity
  project: template-lm-training

# Hydra configuration - automatic directory naming
hydra:
  mode: MULTIRUN
  run:
    dir: ${cache_dir}/${setting}/${clean_dirname:${hydra.job.override_dirname},${oc.select:structure,null},${oc.select:relation,null}}/${name}
  sweep:
    dir: ${cache_dir}/${setting}
    subdir: ${clean_dirname:${hydra.job.override_dirname},${oc.select:structure,null},${oc.select:relation,null}}/${name}
  job:
    chdir: false
    config:
      override_dirname:
        exclude_keys: ["runner", "overwrite"]
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null

# Keys that never touch the trained weights, excluded from a run's identity (`config.run_key`):
# paths and flags, logging, evaluation (draws no RNG, updates no parameter), checkpoint cadence
# and compilation. A cached run is reused while everything else in its resolved config matches.
run_key_exclude:
  - run_key_exclude
  - cache_dir
  - run_dir
  - output_dir
  - data_path
  - eval_file
  - overwrite
  - wandb
  - eval_kwargs
  - eval_cache_dir
  - training_kwargs.eval_steps
  - training_kwargs.save_online_eval
  - training_kwargs.logging_steps
  - training_kwargs.save_steps_method
  - training_kwargs.num_save_checkpoints
  - training_kwargs.save_steps
  - training_kwargs.pre_batch_data_collator
  - training_kwargs.compile
  - training_kwargs.compile_mode

# Environment variable for cache directory (falls back to ./outputs if unset)
cache_dir: ${oc.env:CACHE_DIR,./outputs}

# Common paths computed from cache_dir
output_dir: ${run_dir} # overridden by runners that checkpoint (e.g. ${run_dir}/checkpoints)
data_path: ${cache_dir}/${setting}/${name}/data.pt
run_dir: ${hydra:runtime.output_dir}
eval_file: eval.npz # a checkpoint's saved evaluation: loss, logits, representation, readout
